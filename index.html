<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    #img-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    #carta {
      position: absolute;
      width: 430px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0) rotate(0deg);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none;
      z-index: 10;
    }

    /* ZONA SECRETA DE DOBLE TOQUE */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 10000;
      background: transparent;
      touch-action: none;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <img id="img-fondo" src="fondo.png?v=2" alt="Fondo">

  <div id="zona-secreta"></div>

  <div id="capa-menu">
    <h2>Selecciona el Dorso</h2>
    <div class="btn-baraja" data-imagen="bicycle-roja.png" data-filter="contrast(112%) saturate(85%) brightness(82%)" data-rotate="11deg">Bicycle (Roja)</div>
    <div class="btn-baraja" data-imagen="bicycle-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="0deg">Bicycle (Azul)</div>
    <div class="btn-baraja" data-imagen="tallyho-roja.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Roja)</div>
    <div class="btn-baraja" data-imagen="tallyho-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Azul)</div>
  </div>

  <img id="carta" src="bicycle-roja.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    const capaMenu = document.getElementById('capa-menu');
    const zonaSecreta = document.getElementById('zona-secreta');
    const botones = document.querySelectorAll('.btn-baraja');

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let rotacionActual = '0deg';

    // --- VARIABLES MOTOR FÍSICO DE INCLINACIÓN Y REBOTE ---
    let velX = 0;
    let velY = 0;
    let inclinacionX = 0; // Giro lateral (gamma)
    let inclinacionY = 0; // Giro frontal (beta)
    let animacionFisicaID = null;

    const friccion = 0.94;       // Amortiguación de movimiento
    const sensibilidad = 0.15;   // Fuerza de la gravedad al inclinar
    const elasticidad = 0.6;     // Factor de rebote (0.6 = rebote con pérdida natural de fuerza)

    function activarSensores() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', manejarInclinacion);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', manejarInclinacion);
      }
    }

    function manejarInclinacion(e) {
      // Gamma: izquierda/derecha (-90 a 90)
      // Beta: frente/atrás (-180 a 180)
      inclinacionX = e.gamma || 0;
      inclinacionY = (e.beta || 0) - 45; // Restamos 45° asumiendo que el teléfono se sostiene en ángulo natural
    }

    function actualizarFisica() {
      if (carta.style.display !== 'none' && !isDragging) {
        // Aceleración física
        velX += inclinacionX * sensibilidad;
        velY += inclinacionY * sensibilidad;

        // Aplicar rozamiento
        velX *= friccion;
        velY *= friccion;

        currentX += velX;
        currentY += velY;

        // Dimensiones de la pantalla y la carta para colisiones precisas
        const anchoPantalla = window.innerWidth;
        const altoPantalla = window.innerHeight;
        const anchoCarta = carta.offsetWidth || 430;
        const altoCarta = carta.offsetHeight || 600;

        // Borde Izquierdo y Derecho
        if (currentX < 0) {
          currentX = 0;
          velX = -velX * elasticidad; // Invertir dirección y rebotar
        } else if (currentX + anchoCarta > anchoPantalla) {
          currentX = anchoPantalla - anchoCarta;
          velX = -velX * elasticidad;
        }

        // Borde Superior e Inferior
        if (currentY < 0) {
          currentY = 0;
          velY = -velY * elasticidad;
        } else if (currentY + altoCarta > altoPantalla) {
          currentY = altoPantalla - altoCarta;
          velY = -velY * elasticidad;
        }

        carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
      }

      animacionFisicaID = requestAnimationFrame(actualizarFisica);
    }

    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        activarSensores();

        const nuevaImagen = btn.getAttribute('data-imagen');
        const nuevoFiltro = btn.getAttribute('data-filter');
        rotacionActual = btn.getAttribute('data-rotate') || '0deg';

        carta.src = nuevaImagen;
        carta.style.filter = nuevoFiltro;

        currentX = (window.innerWidth - 430) / 2; // Centrar al inicio
        currentY = (window.innerHeight - 600) / 2;
        velX = 0;
        velY = 0;

        carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
        carta.style.display = 'block';
        carta.style.opacity = '1';
        capaMenu.style.display = 'none';

        if (!animacionFisicaID) {
          actualizarFisica();
        }
      });
    });

    let ultimoToqueArriba = 0;

    zonaSecreta.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();

      const ahora = Date.now();
      const diferencia = ahora - ultimoToqueArriba;

      if (diferencia < 550 && diferencia > 30) {
        capaMenu.style.display = 'flex';
        carta.style.display = 'none';
        isDragging = false;
        ultimoToqueArriba = 0;
      } else {
        ultimoToqueArriba = ahora;
      }
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      if (capaMenu.style.display !== 'none' || e.target === zonaSecreta) return;

      const touch = e.touches[0];

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      velX = 0;
      velY = 0;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];

      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;

      carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
