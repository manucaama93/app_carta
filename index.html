<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>TV</title>

  <!-- ICONO PARA LA PANTALLA DE INICIO DE IOS -->
  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>

    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100vw;
      height: 100vh;

      background-image: url('fondo.png?v=2');
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #000;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #carta {

      position: absolute;

      width: 780px;
      height: auto;

      will-change: transform, opacity;

      transform: translate3d(0, 0, 0);

      opacity: 1;

      transition: opacity 0.1s ease-out;

      -webkit-touch-callout: none;
      -webkit-user-select: none;

      pointer-events: auto;
    }

    #capa-permiso {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 9999;

      background: transparent;
    }

  </style>
</head>


<body>

  <div id="capa-permiso"></div>

  <img
    id="carta"
    src="carta.png"
    alt="Carta Doblada"
  >


  <script>

    const carta = document.getElementById('carta');
    const capaPermiso = document.getElementById('capa-permiso');


    // =========================================================
    // VARIABLES
    // =========================================================

    let isDragging = false;

    let touchOffsetX = 0;
    let touchOffsetY = 0;

    let currentX = 0;
    let currentY = 0;

    let ticking = false;

    let lastTouchX = 0;
    let lastTouchY = 0;

    // Posición anterior del dedo
    let previousTouchX = 0;
    let previousTouchY = 0;

    // Física
    let isBouncing = false;

    let vx = 0;
    let vy = 0;

    let bounceAnimId = null;

    const FRICCION = 0.94;


    // =========================================================
    // PERMISOS IOS
    // =========================================================

    capaPermiso.addEventListener('click', () => {

      if (
        typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function'
      ) {

        DeviceMotionEvent.requestPermission()

          .then(response => {

            if (response === 'granted') {

              window.addEventListener(
                'devicemotion',
                manejarAgitacion,
                true
              );

            }

          })

          .catch(console.error)

          .finally(() => {

            capaPermiso.remove();

          });

      } else {

        window.addEventListener(
          'devicemotion',
          manejarAgitacion,
          true
        );

        capaPermiso.remove();

      }

    });


    // =========================================================
    // DETENER ANIMACIONES
    // =========================================================

    function detenerAnimaciones() {

      isBouncing = false;

      if (bounceAnimId !== null) {

        cancelAnimationFrame(bounceAnimId);

        bounceAnimId = null;

      }

      vx = 0;
      vy = 0;

    }


    // =========================================================
    // OCULTAR CARTA
    // =========================================================

    function ocultarCarta() {

      isDragging = false;

      isBouncing = false;

      vx = 0;
      vy = 0;


      if (bounceAnimId !== null) {

        cancelAnimationFrame(bounceAnimId);

        bounceAnimId = null;

      }


      carta.style.transition =
        'opacity 0.1s ease-out';

      carta.style.opacity = '0';


      setTimeout(() => {

        if (carta.style.opacity === '0') {

          carta.style.display = 'none';

        }

      }, 100);

    }


    // =========================================================
    // COMPROBAR SI HAY QUE HACER DESAPARECER LA CARTA
    // =========================================================

    function comprobarSalida(x, y) {

      const ancho = window.innerWidth;
      const alto = window.innerHeight;


      /*
       * PRIMERA CONDICIÓN:
       *
       * El dedo ha llegado al borde izquierdo.
       *
       * Usamos <= 3 en lugar de <= 0 porque Safari
       * puede dejar de enviar eventos justo antes
       * de que el dedo salga físicamente de la pantalla.
       */

      if (x <= 3) {

        ocultarCarta();

        return true;

      }


      /*
       * Borde derecho
       */

      if (x >= ancho - 3) {

        ocultarCarta();

        return true;

      }


      /*
       * Borde superior
       */

      if (y <= 3) {

        ocultarCarta();

        return true;

      }


      /*
       * Borde inferior
       */

      if (y >= alto - 3) {

        ocultarCarta();

        return true;

      }


      return false;

    }


    // =========================================================
    // TOUCH START
    // =========================================================

    window.addEventListener(
      'touchstart',
      (e) => {

        e.preventDefault();

        detenerAnimaciones();


        const touch = e.touches[0];


        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;

        previousTouchX = touch.clientX;
        previousTouchY = touch.clientY;


        carta.style.display = 'block';

        carta.style.opacity = '1';

        carta.style.transition = 'none';


        isDragging = true;


        /*
         * Calculamos la distancia entre el dedo
         * y la posición de la carta.
         */

        touchOffsetX =
          touch.clientX - currentX;

        touchOffsetY =
          touch.clientY - currentY;

      },

      {
        passive: false
      }
    );


    // =========================================================
    // TOUCH MOVE
    // =========================================================

    window.addEventListener(
      'touchmove',
      (e) => {

        if (!isDragging) return;


        e.preventDefault();


        const touch = e.touches[0];


        const x = touch.clientX;
        const y = touch.clientY;


        /*
         * Guardamos las posiciones.
         */

        lastTouchX = x;
        lastTouchY = y;


        /*
         * Calculamos hacia dónde se está moviendo
         * el dedo.
         */

        const movimientoX =
          x - previousTouchX;


        const movimientoY =
          y - previousTouchY;


        /*
         * =====================================================
         * MUY IMPORTANTE
         *
         * Si el dedo está llegando al borde izquierdo
         * mientras se mueve hacia la izquierda,
         * hacemos desaparecer la carta.
         * =====================================================
         */

        if (
          x <= 3 &&
          movimientoX <= 0
        ) {

          ocultarCarta();

          return;

        }


        /*
         * Lo mismo para el resto de bordes.
         */

        if (
          x >= window.innerWidth - 3 &&
          movimientoX >= 0
        ) {

          ocultarCarta();

          return;

        }


        if (
          y <= 3 &&
          movimientoY <= 0
        ) {

          ocultarCarta();

          return;

        }


        if (
          y >= window.innerHeight - 3 &&
          movimientoY >= 0
        ) {

          ocultarCarta();

          return;

        }


        /*
         * Actualizamos la posición anterior.
         */

        previousTouchX = x;
        previousTouchY = y;


        /*
         * Nueva posición de la carta.
         */

        currentX =
          x - touchOffsetX;

        currentY =
          y - touchOffsetY;


        /*
         * Actualizamos la pantalla usando
         * requestAnimationFrame.
         */

        if (!ticking) {

          ticking = true;


          requestAnimationFrame(() => {

            if (!isDragging) {

              ticking = false;

              return;

            }


            carta.style.transform =
              `translate3d(
                ${currentX}px,
                ${currentY}px,
                0
              )`;


            ticking = false;

          });

        }

      },

      {
        passive: false
      }
    );


    // =========================================================
    // TOUCH END
    // =========================================================

    window.addEventListener(
      'touchend',
      () => {

        if (!isDragging) return;


        /*
         * Última comprobación.
         */

        comprobarSalida(
          lastTouchX,
          lastTouchY
        );


        isDragging = false;

      }
    );


    // =========================================================
    // TOUCH CANCEL
    // =========================================================

    window.addEventListener(
      'touchcancel',
      () => {

        isDragging = false;

      }
    );


    // =========================================================
    // SENSOR DE MOVIMIENTO
    // =========================================================

    let lastX = null;
    let lastY = null;
    let lastZ = null;


    function manejarAgitacion(e) {

      if (isDragging) return;


      const acc =
        e.accelerationIncludingGravity ||
        e.acceleration;


      if (!acc) return;


      if (lastX !== null) {

        const deltaX =
          acc.x - lastX;

        const deltaY =
          acc.y - lastY;

        const deltaZ =
          acc.z - lastZ;


        const fuerza =
          Math.abs(deltaX) +
          Math.abs(deltaY) +
          Math.abs(deltaZ);


        if (fuerza > 12) {

          const dirX =
            deltaX > 0 ? -1 : 1;


          const dirY =
            deltaY > 0 ? 1 : -1;


          aplicarImpulso(
            dirX * fuerza * 0.8,
            dirY * fuerza * 0.8
          );

        }

      }


      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;

    }


    // =========================================================
    // APLICAR IMPULSO
    // =========================================================

    function aplicarImpulso(
      impulsX,
      impulsY
    ) {

      if (isDragging) return;


      carta.style.display = 'block';

      carta.style.opacity = '1';

      carta.style.transition = 'none';


      vx += impulsX;
      vy += impulsY;


      const maxVel = 35;


      vx = Math.max(
        -maxVel,
        Math.min(maxVel, vx)
      );


      vy = Math.max(
        -maxVel,
        Math.min(maxVel, vy)
      );


      if (!isBouncing) {

        isBouncing = true;

        animarFisica();

      }

    }


    // =========================================================
    // FÍSICA DE REBOTE
    // =========================================================

    function animarFisica() {

      if (
        !isBouncing ||
        isDragging
      ) {

        return;

      }


      vx *= FRICCION;
      vy *= FRICCION;


      currentX += vx;
      currentY += vy;


      const maxEdgeX =
        window.innerWidth / 2;


      const maxEdgeY =
        window.innerHeight / 2;


      // Rebote horizontal

      if (currentX >= maxEdgeX) {

        currentX = maxEdgeX;

        vx = -vx * 0.7;

      }

      else if (currentX <= -maxEdgeX) {

        currentX = -maxEdgeX;

        vx = -vx * 0.7;

      }


      // Rebote vertical

      if (currentY >= maxEdgeY) {

        currentY = maxEdgeY;

        vy = -vy * 0.7;

      }

      else if (currentY <= -maxEdgeY) {

        currentY = -maxEdgeY;

        vy = -vy * 0.7;

      }


      carta.style.transform =
        `translate3d(
          ${currentX}px,
          ${currentY}px,
          0
        )`;


      if (
        Math.abs(vx) < 0.2 &&
        Math.abs(vy) < 0.2
      ) {

        isBouncing = false;

        vx = 0;
        vy = 0;

        return;

      }


      bounceAnimId =
        requestAnimationFrame(
          animarFisica
        );

    }

  </script>

</body>
</html>
