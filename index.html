<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <!-- ICONO PARA LA PANTALLA DE INICIO DE IOS -->
  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.png?v=2');
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #carta {
      position: absolute;
      width: 780px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      opacity: 1;
      transition: opacity 0.1s ease-out; 
    }
  </style>
</head>
<body>

  <img id="carta" src="carta.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    // Variables para la animación de rebote (física)
    let isBouncing = false;
    let vx = 0, vy = 0; // Velocidad X e Y
    let bounceAnimId = null;

    // --- LÓGICA DE TOCAR Y ARRASTRAR (Gesto táctil) ---
    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      
      // Si la carta estaba rebotando por agitación, detiene el rebote al tocarla
      if (isBouncing) {
        isBouncing = false;
        cancelAnimationFrame(bounceAnimId);
      }

      // Solicitar permisos de acelerómetro en iOS (necesario a partir de iOS 13)
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().catch(() => {});
      }

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      const touchX = touch.clientX;
      const touchY = touch.clientY;

      currentX = touchX - startX;
      currentY = touchY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 20;

          // Desvanecer al llegar al borde
          if (
            touchX <= sensibilidad || 
            touchX >= screenWidth - sensibilidad || 
            touchY <= sensibilidad || 
            touchY >= screenHeight - sensibilidad
          ) {
            carta.style.transition = 'opacity 0.1s ease-out';
            carta.style.opacity = '0';
            
            setTimeout(() => {
              if (carta.style.opacity === '0') {
                  carta.style.display = 'none';
              }
            }, 100);

            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // --- LÓGICA DE AGITACIÓN (Shake Detection) ---
    let lastX = null, lastY = null, lastZ = null;
    const SHAKE_THRESHOLD = 18; // Sensibilidad de la agitación

    window.addEventListener('devicemotion', (e) => {
      if (isDragging) return; // No rebotar si la estás agarrando con el dedo

      const acc = e.accelerationIncludingGravity;
      if (!acc) return;

      if (lastX !== null) {
        const deltaX = Math.abs(acc.x - lastX);
        const deltaY = Math.abs(acc.y - lastY);
        const deltaZ = Math.abs(acc.z - lastZ);

        // Si la aceleración supera el umbral, activamos el rebote
        if (deltaX + deltaY + deltaZ > SHAKE_THRESHOLD && !isBouncing) {
          iniciarRebote();
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    });

    function iniciarRebote() {
      isBouncing = true;
      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      // Asignar una velocidad inicial aleatoria hacia alguna dirección
      vx = (Math.random() > 0.5 ? 1 : -1) * (12 + Math.random() * 8);
      vy = (Math.random() > 0.5 ? 1 : -1) * (12 + Math.random() * 8);

      animarRebote();
    }

    function animarRebote() {
      if (!isBouncing) return;

      currentX += vx;
      currentY += vy;

      // Calcular los límites de la pantalla considerando el centro de la imagen
      const maxEdgeX = (window.innerWidth / 2);
      const maxEdgeY = (window.innerHeight / 2);

      // Rebotar en bordes horizontales (Izquierda / Derecha)
      if (currentX >= maxEdgeX || currentX <= -maxEdgeX) {
        vx = -vx; // Invertir dirección X
      }

      // Rebotar en bordes verticales (Arriba / Abajo)
      if (currentY >= maxEdgeY || currentY <= -maxEdgeY) {
        vy = -vy; // Invertir dirección Y
      }

      carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      bounceAnimId = requestAnimationFrame(animarRebote);
    }
  </script>
</body>
</html>
