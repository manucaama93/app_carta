<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Juego de Magia</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #carta {
      position: absolute;
      width: 780px; /* Tamaño gigante x3 */
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      opacity: 1;
      /* Se añade la transición para el desvanecimiento de salida */
      transition: opacity 0.1s ease-out; 
    }
  </style>
</head>
<body>

  <img id="carta" src="carta.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      
      // Reiniciar visibilidad al tocar (por si se ocultó)
      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none'; // Desactivar transición al mover

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      const touchX = touch.clientX;
      const touchY = touch.clientY;

      currentX = touchX - startX;
      currentY = touchY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // NUEVA LÓGICA DE SALIDA LIMPIA
          // 'sensibilidad' define cuánto debe acercarse EL DEDO al borde para activar el desvanecimiento.
          // Usamos un margen de 20 píxeles.
          const sensibilidad = 20;

          if (
            touchX <= sensibilidad || 
            touchX >= screenWidth - sensibilidad || 
            touchY <= sensibilidad || 
            touchY >= screenHeight - sensibilidad
          ) {
            // ACTIVAR DESVANECIMIENTO DE SALIDA
            carta.style.transition = 'opacity 0.1s ease-out'; // Volver a activar transición
            carta.style.opacity = '0'; // Se oculta suavemente
            
            // Ocultar de golpe el objeto después de 100ms para asegurar la limpieza
            setTimeout(() => {
              if (carta.style.opacity === '0') {
                  carta.style.display = 'none';
              }
            }, 100);

            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
