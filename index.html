<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <!-- ICONO PARA LA PANTALLA DE INICIO DE IOS -->
  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.png?v=2');
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #carta {
      position: absolute;
      width: 780px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      opacity: 1;
      transition: opacity 0.1s ease-out;

      /* EVITA EL MENÚ EMERGENTE Y SELECCIÓN EN IOS */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
    }
    #capa-permiso {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: transparent;
    }
  </style>
</head>
<body>

  <div id="capa-permiso"></div>
  <img id="carta" src="carta.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    const capaPermiso = document.getElementById('capa-permiso');

    let isDragging = false;
    let touchOffsetX = 0, touchOffsetY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    // Física de movimiento
    let isBouncing = false;
    let vx = 0, vy = 0;
    let bounceAnimId = null;
    const FRICCION = 0.94;

    // Permisos en iOS
    capaPermiso.addEventListener('click', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', manejarAgitacion, true);
            }
          })
          .catch(console.error)
          .finally(() => {
            capaPermiso.remove();
          });
      } else {
        window.addEventListener('devicemotion', manejarAgitacion, true);
        capaPermiso.remove();
      }
    });

    // DETENER CUALQUIER ANIMACIÓN O FÍSICA
    function detenerAnimaciones() {
      isBouncing = false;
      if (bounceAnimId) {
        cancelAnimationFrame(bounceAnimId);
        bounceAnimId = null;
      }
      vx = 0;
      vy = 0;
    }

    // CONTROL TÁCTIL (Touch Events)
    window.addEventListener('touchstart', (e) => {
      // 1. Apagar la física del tirón
      detenerAnimaciones();

      // 2. Marcar arrastre activo para que la agitación no moleste
      isDragging = true;

      const touch = e.touches[0];

      // 3. Restaurar visibilidad
      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      // 4. Calcular el desfase exacto respecto al toque en ese instante preciso
      touchOffsetX = touch.clientX - currentX;
      touchOffsetY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];

      // La posición de la carta sigue estrictamente la mano
      currentX = touch.clientX - touchOffsetX;
      currentY = touch.clientY - touchOffsetY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const touchX = touch.clientX;
          const touchY = touch.clientY;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 20;

          // Salida por los bordes
          if (
            touchX <= sensibilidad || 
            touchX >= screenWidth - sensibilidad || 
            touchY <= sensibilidad || 
            touchY >= screenHeight - sensibilidad
          ) {
            carta.style.transition = 'opacity 0.1s ease-out';
            carta.style.opacity = '0';
            
            setTimeout(() => {
              if (carta.style.opacity === '0') {
                  carta.style.display = 'none';
              }
            }, 100);

            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // SENSOR DE MOVIMIENTO
    let lastX = null, lastY = null, lastZ = null;

    function manejarAgitacion(e) {
      // SI ESTAMOS ARRASTRANDO, IGNORAR EL SENSOR
      if (isDragging) return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      if (lastX !== null) {
        const deltaX = acc.x - lastX;
        const deltaY = acc.y - lastY;
        const deltaZ = acc.z - lastZ;

        const fuerza = Math.abs(deltaX) + Math.abs(deltaY) + Math.abs(deltaZ);

        if (fuerza > 12) {
          const dirX = deltaX > 0 ? -1 : 1;
          const dirY = deltaY > 0 ? 1 : -1;
          
          aplicarImpulso(dirX * fuerza * 0.8, dirY * fuerza * 0.8);
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }

    // FÍSICA
    function aplicarImpulso(impulsX, impulsY) {
      if (isDragging) return;

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      vx += impulsX;
      vy += impulsY;

      const maxVel = 35;
      vx = Math.max(-maxVel, Math.min(maxVel, vx));
      vy = Math.max(-maxVel, Math.min(maxVel, vy));

      if (!isBouncing) {
        isBouncing = true;
        animarFisica();
      }
    }

    function animarFisica() {
      if (!isBouncing || isDragging) return;

      vx *= FRICCION;
      vy *= FRICCION;

      currentX += vx;
      currentY += vy;

      const maxEdgeX = (window.innerWidth / 2);
      const maxEdgeY = (window.innerHeight / 2);

      // Rebotes
      if (currentX >= maxEdgeX) {
        currentX = maxEdgeX;
        vx = -vx * 0.7;
      } else if (currentX <= -maxEdgeX) {
        currentX = -maxEdgeX;
        vx = -vx * 0.7;
      }

      if (currentY >= maxEdgeY) {
        currentY = maxEdgeY;
        vy = -vy * 0.7;
      } else if (currentY <= -maxEdgeY) {
        currentY = -maxEdgeY;
        vy = -vy * 0.7;
      }

      carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      if (Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2) {
        isBouncing = false;
        vx = 0;
        vy = 0;
        return;
      }

      bounceAnimId = requestAnimationFrame(animarFisica);
    }
  </script>
</body>
</html>
