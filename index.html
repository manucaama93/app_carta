<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Juego de Magia</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #carta {
      position: absolute;
      width: 780px; /* Tamaño gigante x3 */
      height: auto;
      will-change: transform;
      transform: translate3d(0,0,0);
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <img id="carta" src="carta.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      
      // Asegurar que la carta sea visible al tocar
      carta.style.display = 'block';
      isDragging = true;
      
      // Guardar el offset inicial respecto a donde pones el dedo
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      const touchX = touch.clientX;
      const touchY = touch.clientY;

      currentX = touchX - startX;
      currentY = touchY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const borderMargin = 15; // Sensibilidad al borde según la posición del DEDO

          // Ocultar si EL DEDO (no los bordes de la carta) alcanza el margen exterior
          if (
            touchX <= borderMargin || 
            touchX >= screenWidth - borderMargin || 
            touchY <= borderMargin || 
            touchY >= screenHeight - borderMargin
          ) {
            carta.style.display = 'none'; // Desaparece la carta
            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
</body>
</html>
