<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.png?v=2');
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #carta {
      position: absolute;
      width: 780px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none; /* Oculta al inicio */
    }

    /* ZONA SECRETA DE DOBLE TOQUE (Superior) */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 60px; /* Área de la barra de estado superior */
      z-index: 8888;
      background: transparent;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Zona transparente superior para reactivar el menú con doble toque -->
  <div id="zona-secreta"></div>

  <!-- Menú de Selección -->
  <div id="capa-menu">
    <h2>Selecciona el Dorso</h2>
    <div class="btn-baraja" data-imagen="bicycle-roja.png">Bicycle (Roja)</div>
    <div class="btn-baraja" data-imagen="bicycle-azul.png">Bicycle (Azul)</div>
    <div class="btn-baraja" data-imagen="tallyho-roja.png">Tally-Ho (Roja)</div>
    <div class="btn-baraja" data-imagen="tallyho-azul.png">Tally-Ho (Azul)</div>
  </div>

  <img id="carta" src="bicycle-roja.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    const capaMenu = document.getElementById('capa-menu');
    const zonaSecreta = document.getElementById('zona-secreta');
    const botones = document.querySelectorAll('.btn-baraja');

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;
    let lastTouchX = 0, lastTouchY = 0;

    // 1. SELECCIÓN DE DORSOS Y PERMISO SENSOR
    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const nuevaImagen = btn.getAttribute('data-imagen');
        carta.src = nuevaImagen;

        // Ocultar menú
        capaMenu.style.display = 'none';

        // Solicitar permisos de movimiento si es necesario en iOS
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission()
            .then(response => {
              if (response === 'granted') {
                window.addEventListener('devicemotion', manejarAgitacion, true);
              }
            })
            .catch(console.error);
        } else {
          window.addEventListener('devicemotion', manejarAgitacion, true);
        }
      });
    });

    // 2. ACTIVACIÓN SECRETA DEL MENÚ (Doble toque arriba)
    let ultimoToqueArriba = 0;

    zonaSecreta.addEventListener('touchstart', (e) => {
      const ahora = new Date().getTime();
      const diferencia = ahora - ultimoToqueArriba;

      if (diferencia < 300 && diferencia > 0) {
        // Doble toque detectado en la zona superior
        capaMenu.style.display = 'flex';
        carta.style.display = 'none';
        isDragging = false;
      }
      ultimoToqueArriba = ahora;
    });

    function ocultarCarta() {
      carta.style.transition = 'opacity 0.1s ease-out';
      carta.style.opacity = '0';
      
      setTimeout(() => {
        if (carta.style.opacity === '0') {
          carta.style.display = 'none';
        }
      }, 100);

      isDragging = false;
    }

    // 3. CONTROL TÁCTIL DE LA CARTA
    window.addEventListener('touchstart', (e) => {
      // Si el menú está abierto, ignorar interacción de arrastre
      if (capaMenu.style.display !== 'none') return;

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 60;

          if (
            lastTouchX <= sensibilidad || 
            lastTouchX >= screenWidth - sensibilidad || 
            lastTouchY <= sensibilidad || 
            lastTouchY >= screenHeight - sensibilidad
          ) {
            ocultarCarta();
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const sensibilidad = 60;

      if (
        lastTouchX <= sensibilidad || 
        lastTouchX >= screenWidth - sensibilidad || 
        lastTouchY <= sensibilidad || 
        lastTouchY >= screenHeight - sensibilidad
      ) {
        ocultarCarta();
      }

      isDragging = false;
    });

    // 4. SENSOR DE MOVIMIENTO (Agitación)
    let lastX = null, lastY = null, lastZ = null;

    function manejarAgitacion(e) {
      if (isDragging || capaMenu.style.display !== 'none') return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      if (lastX !== null) {
        const deltaX = acc.x - lastX;
        const deltaY = acc.y - lastY;
        const deltaZ = acc.z - lastZ;

        const fuerza = Math.abs(deltaX) + Math.abs(deltaY) + Math.abs(deltaZ);

        if (fuerza > 12) {
          currentX = 0;
          currentY = 0;
          startX = 0;
          startY = 0;
          
          carta.style.transform = `translate3d(0px, 0px, 0)`;
          carta.style.display = 'block';
          carta.style.opacity = '1';
          carta.style.transition = 'none';
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }
  </script>
</body>
</html>
