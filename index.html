<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    #img-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    #carta {
      position: absolute;
      width: 430px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0) rotate(0deg);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none;
      z-index: 10;
    }

    /* ANIMACIÓN DE TEMBLOR (SHAKE) REPETITIVO */
    @keyframes temblor {
      0% { transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) rotate(var(--rotacion-base, 0deg)); }
      15% { transform: translate3d(calc(var(--pos-x, 0px) - 12px), calc(var(--pos-y, 0px) + 8px), 0) rotate(calc(var(--rotacion-base, 0deg) - 8deg)); }
      30% { transform: translate3d(calc(var(--pos-x, 0px) + 12px), calc(var(--pos-y, 0px) - 8px), 0) rotate(calc(var(--rotacion-base, 0deg) + 8deg)); }
      45% { transform: translate3d(calc(var(--pos-x, 0px) - 10px), calc(var(--pos-y, 0px) - 6px), 0) rotate(calc(var(--rotacion-base, 0deg) - 5deg)); }
      60% { transform: translate3d(calc(var(--pos-x, 0px) + 10px), calc(var(--pos-y, 0px) + 6px), 0) rotate(calc(var(--rotacion-base, 0deg) + 5deg)); }
      75% { transform: translate3d(calc(var(--pos-x, 0px) - 5px), calc(var(--pos-y, 0px) + 3px), 0) rotate(calc(var(--rotacion-base, 0deg) - 2deg)); }
      100% { transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) rotate(var(--rotacion-base, 0deg)); }
    }

    /* Ciclos repetidos para ampliar la duración */
    .animar-temblor {
      animation: temblor 0.4s ease-in-out infinite;
    }

    /* ZONA SECRETA DE DOBLE TOQUE */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 10000;
      background: transparent;
      touch-action: none;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <img id="img-fondo" src="fondo.png?v=2" alt="Fondo">

  <div id="zona-secreta"></div>

  <div id="capa-menu">
    <h2>Selecciona el Dorso</h2>
    <div class="btn-baraja" data-imagen="bicycle-roja.png" data-filter="contrast(112%) saturate(85%) brightness(82%)" data-rotate="11deg">Bicycle (Roja)</div>
    <div class="btn-baraja" data-imagen="bicycle-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="0deg">Bicycle (Azul)</div>
    <div class="btn-baraja" data-imagen="tallyho-roja.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Roja)</div>
    <div class="btn-baraja" data-imagen="tallyho-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Azul)</div>
  </div>

  <img id="carta" src="bicycle-roja.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    const capaMenu = document.getElementById('capa-menu');
    const zonaSecreta = document.getElementById('zona-secreta');
    const botones = document.querySelectorAll('.btn-baraja');

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;
    let lastTouchX = 0, lastTouchY = 0;
    let rotacionActual = '0deg';
    let animandoAgitamiento = false;

    function activarSensoresMovimiento() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('devicemotion', detectarAgitamiento);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('devicemotion', detectarAgitamiento);
      }
    }

    let ultimaX = 0, ultimaY = 0, ultimaZ = 0;
    let umbralAgitamiento = 20;

    function detectarAgitamiento(event) {
      if (carta.style.display === 'none' || animandoAgitamiento) return;

      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      const deltaX = Math.abs(acc.x - ultimaX);
      const deltaY = Math.abs(acc.y - ultimaY);
      const deltaZ = Math.abs(acc.z - ultimaZ);

      if (deltaX + deltaY + deltaZ > umbralAgitamiento) {
        ejecutarEfectoTemblor();
      }

      ultimaX = acc.x;
      ultimaY = acc.y;
      ultimaZ = acc.z;
    }

    function ejecutarEfectoTemblor() {
      if (animandoAgitamiento) return;

      animandoAgitamiento = true;
      carta.style.setProperty('--rotacion-base', rotacionActual);
      carta.style.setProperty('--pos-x', `${currentX}px`);
      carta.style.setProperty('--pos-y', `${currentY}px`);
      carta.classList.add('animar-temblor');

      // Se mantiene temblando durante 1200ms (1.2s)
      setTimeout(() => {
        carta.classList.remove('animar-temblor');
        carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
        animandoAgitamiento = false;
      }, 1200);
    }

    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        activarSensoresMovimiento();

        const nuevaImagen = btn.getAttribute('data-imagen');
        const nuevoFiltro = btn.getAttribute('data-filter');
        rotacionActual = btn.getAttribute('data-rotate') || '0deg';

        carta.src = nuevaImagen;
        carta.style.filter = nuevoFiltro;

        currentX = 0;
        currentY = 0;
        startX = 0;
        startY = 0;
        carta.style.transform = `translate3d(0px, 0px, 0) rotate(${rotacionActual})`;

        carta.style.display = 'block';
        carta.style.opacity = '1';
        capaMenu.style.display = 'none';
      });
    });

    let ultimoToqueArriba = 0;

    zonaSecreta.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();

      const ahora = Date.now();
      const diferencia = ahora - ultimoToqueArriba;

      if (diferencia < 550 && diferencia > 30) {
        capaMenu.style.display = 'flex';
        carta.style.display = 'none';
        isDragging = false;
        ultimoToqueArriba = 0;
      } else {
        ultimoToqueArriba = ahora;
      }
    }, { passive: false });

    function ocultarCarta() {
      carta.style.transition = 'opacity 0.1s ease-out';
      carta.style.opacity = '0';
      
      setTimeout(() => {
        if (carta.style.opacity === '0') {
          carta.style.display = 'none';
        }
      }, 100);

      isDragging = false;
    }

    window.addEventListener('touchstart', (e) => {
      if (capaMenu.style.display !== 'none' || e.target === zonaSecreta || animandoAgitamiento) return;

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || animandoAgitamiento) return;
      e.preventDefault();

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 60;

          if (
            lastTouchX <= sensibilidad || 
            lastTouchX >= screenWidth - sensibilidad || 
            lastTouchY <= sensibilidad || 
            lastTouchY >= screenHeight - sensibilidad
          ) {
            ocultarCarta();
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isDragging || animandoAgitamiento) return;

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const sensibilidad = 60;

      if (
        lastTouchX <= sensibilidad || 
        lastTouchX >= screenWidth - sensibilidad || 
        lastTouchY <= sensibilidad || 
        lastTouchY >= screenHeight - sensibilidad
      ) {
        ocultarCarta();
      }

      isDragging = false;
    });
  </script>
</body>
</html>
