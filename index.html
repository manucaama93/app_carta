<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <!-- ICONO PARA LA PANTALLA DE INICIO DE IOS -->
  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.png?v=2');
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #carta {
      position: absolute;
      width: 780px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      opacity: 1;
      transition: opacity 0.1s ease-out; 
    }
  </style>
</head>
<body>

  <img id="carta" src="carta.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    // Variables de física de rebote
    let isBouncing = false;
    let vx = 0, vy = 0;
    let bounceAnimId = null;
    let permissionRequested = false;

    // Pedir permisos explícitos en iOS al tocar la pantalla
    function activarSensoresIOS() {
      if (!permissionRequested && typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        permissionRequested = true;
        DeviceMotionEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('devicemotion', manejarAgitacion, true);
            }
          })
          .catch(console.error);
      }
    }

    // --- LÓGICA TÁCTIL ---
    let lastTap = 0;

    window.addEventListener('touchstart', (e) => {
      activarSensoresIOS();

      // Alternativa: Doble toque rápido inicia el rebote si el acelerómetro está bloqueado por el SO
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        if (!isBouncing) iniciarRebote();
      }
      lastTap = currentTime;

      const touch = e.touches[0];
      
      if (isBouncing) {
        isBouncing = false;
        cancelAnimationFrame(bounceAnimId);
      }

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      const touchX = touch.clientX;
      const touchY = touch.clientY;

      currentX = touchX - startX;
      currentY = touchY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 20;

          if (
            touchX <= sensibilidad || 
            touchX >= screenWidth - sensibilidad || 
            touchY <= sensibilidad || 
            touchY >= screenHeight - sensibilidad
          ) {
            carta.style.transition = 'opacity 0.1s ease-out';
            carta.style.opacity = '0';
            
            setTimeout(() => {
              if (carta.style.opacity === '0') {
                  carta.style.display = 'none';
              }
            }, 100);

            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // --- DETECCIÓN DE AGITACIÓN ---
    let lastX = null, lastY = null, lastZ = null;

    function manejarAgitacion(e) {
      if (isDragging) return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      if (lastX !== null) {
        const deltaX = Math.abs(acc.x - lastX);
        const deltaY = Math.abs(acc.y - lastY);
        const deltaZ = Math.abs(acc.z - lastZ);

        // Umbral directo de agitación
        if ((deltaX > 10 || deltaY > 10 || deltaZ > 10) && !isBouncing) {
          iniciarRebote();
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }

    // Para dispositivos sin restricción de permisos
    if (typeof DeviceMotionEvent === 'undefined' || typeof DeviceMotionEvent.requestPermission !== 'function') {
      window.addEventListener('devicemotion', manejarAgitacion, true);
    }

    // --- MOTOR DE REBOTE ---
    function iniciarRebote() {
      isBouncing = true;
      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      vx = (Math.random() > 0.5 ? 1 : -1) * (14 + Math.random() * 6);
      vy = (Math.random() > 0.5 ? 1 : -1) * (14 + Math.random() * 6);

      animarRebote();
    }

    function animarRebote() {
      if (!isBouncing) return;

      currentX += vx;
      currentY += vy;

      const maxEdgeX = (window.innerWidth / 2);
      const maxEdgeY = (window.innerHeight / 2);

      if (currentX >= maxEdgeX || currentX <= -maxEdgeX) {
        vx = -vx;
      }

      if (currentY >= maxEdgeY || currentY <= -maxEdgeY) {
        vy = -vy;
      }

      carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      bounceAnimId = requestAnimationFrame(animarRebote);
    }
  </script>
</body>
</html>
