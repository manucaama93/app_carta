<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV</title>

  <link rel="apple-touch-icon" href="icon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    #img-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    #carta {
      position: absolute;
      width: 430px;
      height: auto;
      will-change: transform, opacity;
      transform: translate3d(0,0,0) rotate(0deg);
      opacity: 1;
      transition: opacity 0.1s ease-out;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      pointer-events: auto;
      display: none;
      z-index: 10;
    }

    /* ANIMACIÓN BASADA EN TUS 4 IMÁGENES DE MUESTRA */
    @keyframes caidaRebote {
      /* 1. Posición inicial (Incio del despliegue en diagonal desde la derecha) */
      0% {
        transform: translate3d(20vw, 35vh, 0) rotate(var(--rotacion-base, 0deg));
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      /* 2. Impacto con la pared izquierda (carta2.jpg) */
      40% {
        transform: translate3d(-30px, 60vh, 0) rotate(calc(var(--rotacion-base, 0deg) - 4deg));
      }
      /* 3. Caída hasta el fondo inferior izquierdo (carta3.jpg) */
      75% {
        transform: translate3d(10px, calc(100vh - 360px), 0) rotate(var(--rotacion-base, 0deg));
      }
      /* 4. Rebote leve hacia arriba (efecto rebote suelo) */
      88% {
        transform: translate3d(15px, calc(100vh - 390px), 0) rotate(var(--rotacion-base, 0deg));
      }
      /* 5. Asentamiento final en la base (carta4.jpg) */
      100% {
        transform: translate3d(10px, calc(100vh - 360px), 0) rotate(var(--rotacion-base, 0deg));
      }
    }

    .animar-caida {
      animation: caidaRebote 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* ZONA SECRETA DE DOBLE TOQUE */
    #zona-secreta {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      z-index: 10000;
      background: transparent;
      touch-action: none;
    }

    /* MENÚ DE SELECCIÓN INICIAL Y CONFIGURACIÓN */
    #capa-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      color: #fff;
    }

    #capa-menu h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-baraja {
      width: 220px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-baraja:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <img id="img-fondo" src="fondo.png?v=2" alt="Fondo">

  <div id="zona-secreta"></div>

  <div id="capa-menu">
    <h2>Selecciona el Dorso</h2>
    <div class="btn-baraja" data-imagen="bicycle-roja.png" data-filter="contrast(112%) saturate(85%) brightness(82%)" data-rotate="11deg">Bicycle (Roja)</div>
    <div class="btn-baraja" data-imagen="bicycle-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="0deg">Bicycle (Azul)</div>
    <div class="btn-baraja" data-imagen="tallyho-roja.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Roja)</div>
    <div class="btn-baraja" data-imagen="tallyho-azul.png" data-filter="contrast(100%) saturate(100%) brightness(100%)" data-rotate="11deg">Tally-Ho (Azul)</div>
  </div>

  <img id="carta" src="bicycle-roja.png" alt="Carta Doblada">

  <script>
    const carta = document.getElementById('carta');
    const capaMenu = document.getElementById('capa-menu');
    const zonaSecreta = document.getElementById('zona-secreta');
    const botones = document.querySelectorAll('.btn-baraja');

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;
    let lastTouchX = 0, lastTouchY = 0;
    let rotacionActual = '0deg';
    let enAnimacion = false;

    // --- DETECCIÓN DE SHAKE / SACUDIÓN ---
    function activarSensoresMovimiento() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('devicemotion', detectarAgitamiento);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('devicemotion', detectarAgitamiento);
      }
    }

    let ultimaX = 0, ultimaY = 0, ultimaZ = 0;
    let umbralAgitamiento = 22;

    function detectarAgitamiento(event) {
      if (enAnimacion || isDragging) return;

      const acc = event.accelerationIncludingGravity;
      if (!acc) return;

      const deltaX = Math.abs(acc.x - ultimaX);
      const deltaY = Math.abs(acc.y - ultimaY);
      const deltaZ = Math.abs(acc.z - ultimaZ);

      // Sacudida de arriba a abajo principal
      if (deltaY > 15 || (deltaX + deltaY + deltaZ > umbralAgitamiento)) {
        ejecutarAnimacionDiagonal();
      }

      ultimaX = acc.x;
      ultimaY = acc.y;
      ultimaZ = acc.z;
    }

    function ejecutarAnimacionDiagonal() {
      enAnimacion = true;
      carta.style.display = 'block';
      carta.style.setProperty('--rotacion-base', rotacionActual);
      carta.classList.remove('animar-caida');
      
      // Forzar reflow para reiniciar la animación
      void carta.offsetWidth;
      carta.classList.add('animar-caida');

      // Al finalizar la animación, fijar las coordenadas donde reposó la carta
      setTimeout(() => {
        carta.classList.remove('animar-caida');
        currentX = 10;
        currentY = window.innerHeight - 360;
        carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
        enAnimacion = false;
      }, 750);
    }

    // --- SELECCIÓN EN EL MENÚ ---
    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        activarSensoresMovimiento();

        const nuevaImagen = btn.getAttribute('data-imagen');
        const nuevoFiltro = btn.getAttribute('data-filter');
        rotacionActual = btn.getAttribute('data-rotate') || '0deg';

        carta.src = nuevaImagen;
        carta.style.filter = nuevoFiltro;

        currentX = 0;
        currentY = 0;
        carta.style.transform = `translate3d(0px, 0px, 0) rotate(${rotacionActual})`;

        carta.style.display = 'none'; // Espera a la sacudida para salir
        capaMenu.style.display = 'none';
      });
    });

    // --- DOBLE TOQUE SUPERIOR (ZONA SECRETA) ---
    let ultimoToqueArriba = 0;

    zonaSecreta.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();

      const ahora = Date.now();
      const diferencia = ahora - ultimoToqueArriba;

      if (diferencia < 550 && diferencia > 30) {
        capaMenu.style.display = 'flex';
        carta.style.display = 'none';
        isDragging = false;
        ultimoToqueArriba = 0;
      } else {
        ultimoToqueArriba = ahora;
      }
    }, { passive: false });

    function ocultarCarta() {
      carta.style.transition = 'opacity 0.1s ease-out';
      carta.style.opacity = '0';
      
      setTimeout(() => {
        if (carta.style.opacity === '0') {
          carta.style.display = 'none';
        }
      }, 100);

      isDragging = false;
    }

    // --- ARRASTRE TÁCTIL (POST-ANIMACIÓN) ---
    window.addEventListener('touchstart', (e) => {
      if (capaMenu.style.display !== 'none' || e.target === zonaSecreta || enAnimacion) return;

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || enAnimacion) return;
      e.preventDefault();

      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      currentX = touch.clientX - startX;
      currentY = touch.clientY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotacionActual})`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 60;

          if (
            lastTouchX <= sensibilidad || 
            lastTouchX >= screenWidth - sensibilidad || 
            lastTouchY <= sensibilidad || 
            lastTouchY >= screenHeight - sensibilidad
          ) {
            ocultarCarta();
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isDragging || enAnimacion) return;

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const sensibilidad = 60;

      if (
        lastTouchX <= sensibilidad || 
        lastTouchX >= screenWidth - sensibilidad || 
        lastTouchY <= sensibilidad || 
        lastTouchY >= screenHeight - sensibilidad
      ) {
        ocultarCarta();
      }

      isDragging = false;
    });
  </script>
</body>
</html>
