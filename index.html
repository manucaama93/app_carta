<script>
    const carta = document.getElementById('carta');
    const capaPermiso = document.getElementById('capa-permiso');

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let ticking = false;

    // Variables de física de dado (velocidad y fricción)
    let isBouncing = false;
    let vx = 0, vy = 0;
    let bounceAnimId = null;
    const FRICCION = 0.94; // Cuanto más bajo, más rápido se frena (0.94 es ideal para efecto dado)

    // --- CAPTURA DE PERMISO DIRECTO PARA IOS ---
    capaPermiso.addEventListener('click', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', manejarAgitacion, true);
            }
          })
          .catch(console.error)
          .finally(() => {
            capaPermiso.remove();
          });
      } else {
        window.addEventListener('devicemotion', manejarAgitacion, true);
        capaPermiso.remove();
      }
    });

    // --- LÓGICA TÁCTIL ---
    let lastTap = 0;

    window.addEventListener('touchstart', (e) => {
      // Doble toque rápido para simular un tiro de dado manual
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        aplicarImpulso(15, 15);
      }
      lastTap = currentTime;

      const touch = e.touches[0];
      
      // Si la carta se estaba moviendo, detener la física al poner el dedo
      if (isBouncing) {
        isBouncing = false;
        vx = 0;
        vy = 0;
        cancelAnimationFrame(bounceAnimId);
      }

      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      isDragging = true;
      startX = touch.clientX - currentX;
      startY = touch.clientY - currentY;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault();

      const touch = e.touches[0];
      const touchX = touch.clientX;
      const touchY = touch.clientY;

      currentX = touchX - startX;
      currentY = touchY - startY;

      if (!ticking) {
        requestAnimationFrame(() => {
          carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
          
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const sensibilidad = 20;

          if (
            touchX <= sensibilidad || 
            touchX >= screenWidth - sensibilidad || 
            touchY <= sensibilidad || 
            touchY >= screenHeight - sensibilidad
          ) {
            carta.style.transition = 'opacity 0.1s ease-out';
            carta.style.opacity = '0';
            
            setTimeout(() => {
              if (carta.style.opacity === '0') {
                  carta.style.display = 'none';
              }
            }, 100);

            isDragging = false;
          }
          
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // --- DETECCIÓN DE AGITACIÓN CON IMPULSO ---
    let lastX = null, lastY = null, lastZ = null;

    function manejarAgitacion(e) {
      if (isDragging) return;

      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      if (lastX !== null) {
        const deltaX = acc.x - lastX;
        const deltaY = acc.y - lastY;
        const deltaZ = acc.z - lastZ;

        const fuerza = Math.abs(deltaX) + Math.abs(deltaY) + Math.abs(deltaZ);

        // Si la agitación supera el umbral, le sumamos impulso proporcional
        if (fuerza > 12) {
          // Dirección según hacia dónde sacudas el teléfono
          const dirX = deltaX > 0 ? -1 : 1;
          const dirY = deltaY > 0 ? 1 : -1;
          
          aplicarImpulso(dirX * fuerza * 0.8, dirY * fuerza * 0.8);
        }
      }

      lastX = acc.x;
      lastY = acc.y;
      lastZ = acc.z;
    }

    // --- MOTOR DE FÍSICA Y REBOTE TIPO DADO ---
    function aplicarImpulso(impulsX, impulsY) {
      carta.style.display = 'block';
      carta.style.opacity = '1';
      carta.style.transition = 'none';

      // Sumar impulso a la velocidad actual
      vx += impulsX;
      vy += impulsY;

      // Limitar velocidad máxima para que no se vuelva loca la imagen
      const maxVel = 35;
      vx = Math.max(-maxVel, Math.min(maxVel, vx));
      vy = Math.max(-maxVel, Math.min(maxVel, vy));

      if (!isBouncing) {
        isBouncing = true;
        animarFisica();
      }
    }

    function animarFisica() {
      if (!isBouncing) return;

      // Aplicar fricción (reduce velocidad en cada frame)
      vx *= FRICCION;
      vy *= FRICCION;

      currentX += vx;
      currentY += vy;

      const maxEdgeX = (window.innerWidth / 2);
      const maxEdgeY = (window.innerHeight / 2);

      // Rebotar en bordes horizontales perdiendo un poco de energía
      if (currentX >= maxEdgeX) {
        currentX = maxEdgeX;
        vx = -vx * 0.7; // El 0.7 hace que el rebote absorba energía como un objeto real
      } else if (currentX <= -maxEdgeX) {
        currentX = -maxEdgeX;
        vx = -vx * 0.7;
      }

      // Rebotar en bordes verticales
      if (currentY >= maxEdgeY) {
        currentY = maxEdgeY;
        vy = -vy * 0.7;
      } else if (currentY <= -maxEdgeY) {
        currentY = -maxEdgeY;
        vy = -vy * 0.7;
      }

      carta.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      // Si la velocidad es casi cero, detener la animación por completo
      if (Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2) {
        isBouncing = false;
        vx = 0;
        vy = 0;
        return;
      }

      bounceAnimId = requestAnimationFrame(animarFisica);
    }
  </script>
